name: Build & Release

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node JS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Get current build number
        id: build-number
        run: |
          cd .github/builds
          npm install
          npm run --silent get_number >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          ./gradlew build \
            -Pcommit=${{ github.sha }} \
            -Pbuild_number=${{ steps.build-number.outputs.number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build-number.outputs.number }}
          name: Build ${{ steps.build-number.outputs.number }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
